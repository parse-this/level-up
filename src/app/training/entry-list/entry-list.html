<button matButton="filled" type="button" class="new-entry" [matMenuTriggerFor]="newMenu.menu()">
  <mat-icon fontSet="material-symbols-outlined">add</mat-icon>
  New entry
</button>
<app-entry-type-menu #newMenu (picked)="newEntry($event)" />

<nav class="entry-list" aria-label="Log">
  @for (e of store.entries(); track e.id) {
    @let names = exerciseNames(e);
    <a class="entry" [routerLink]="['/training', e.id]">
      <mat-icon class="entry-icon" fontSet="material-symbols-outlined" aria-hidden="true">{{
        icon(e)
      }}</mat-icon>
      <div class="entry-main">
        <div class="entry-title">
          {{ title(e) }}
          @if (e.notes) {
            <mat-icon class="notes-icon" fontSet="material-symbols-outlined" aria-label="Has notes">notes</mat-icon>
          }
        </div>
        <div class="entry-meta">{{ meta(e) }}</div>
        @if (names) {
          <div class="entry-exercises">{{ names }}</div>
        }
      </div>
      <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">chevron_right</mat-icon>
    </a>
  } @empty {
    <p class="empty">Nothing logged yet. Press Start: tap "New entry".</p>
  }
</nav>
